name: build

# Push/PR runs checks only; installers are built only for a release (release.yml sets package).
# Docs-only changes (*.md, docs/) skip CI entirely.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04's glibc (2.35) keeps the Linux packages portable to newer distros.
          - os: ubuntu-22.04
            dist: dist:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm
              dist/*.pacman
              dist/latest-linux.yml
          - os: windows-latest
            dist: dist:win
            artifacts: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: E2E smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
      - if: inputs.package
        run: pnpm ${{ matrix.dist }}
      - if: inputs.package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wraithgrid-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
