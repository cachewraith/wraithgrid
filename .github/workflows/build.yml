name: build

# Push/PR runs checks only; installers are built only for a release (release.yml sets package).
# Docs-only changes (*.md, docs/) skip CI entirely.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The Rust pty host (ADR 0004): its own checks, then the parity suite against the Node host,
  # on Linux here and on macOS in the build job (phase 3); the runner's preinstalled Rust.
  rust-host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: cargo fmt, clippy, test
        working-directory: host-rs
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      # The static x64 and arm64 hosts copied to remote machines (ADR 0004 phase 5).
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: bash scripts/build-remote-hosts.sh
      - run: bun run test:host

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04's glibc (2.35) keeps the Linux packages portable to newer distros.
          - os: ubuntu-22.04
            dist: dist:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm
              dist/*.pacman
              dist/latest-linux.yml
          - os: windows-latest
            dist: dist:win
            artifacts: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          # Apple Silicon runner; electron-builder also builds the Intel (x64) app there.
          - os: macos-latest
            dist: dist:mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Bun installs and runs scripts; electron-vite, Vitest and Playwright still run on Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools xvfb gcc-aarch64-linux-gnu
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - name: E2E smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:e2e
      # The Rust host on macOS (ADR 0004 phase 3): its tests and the parity suite against the
      # Node host, as the rust-host job runs them on Linux.
      - name: Rust host on macOS
        if: runner.os == 'macOS'
        run: |
          cargo test --locked --manifest-path host-rs/Cargo.toml
          bun run test:host
          bash scripts/build-mac-host.sh
      # Windows (phase 3b): clippy for the Windows code, and the tests, whose smoke test runs
      # the built host over its named pipe with ConPTY panes (the parity suite is Unix only).
      - name: Rust host on Windows
        if: runner.os == 'Windows'
        working-directory: host-rs
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - if: inputs.package
        run: bun run ${{ matrix.dist }}
        env:
          # No Developer ID: never pick up a random certificate from the runner's keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: inputs.package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wraithgrid-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
