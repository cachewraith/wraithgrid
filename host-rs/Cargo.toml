[package]
name = "wraithgrid-host"
version = "0.1.0"
edition = "2021"
description = "Wraithgrid's background pty host (ADR 0004): same socket and frames as src/host"
license = "MIT"
publish = false

[[bin]]
name = "wraithgrid-host"
path = "src/main.rs"

[dependencies]
libc = "0.2"
portable-pty = "0.9.0"
regex = "1"
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "io-std"] }
vt100 = "0.18.1"

# Windows (ADR 0004 phase 3b): our own ConPTY spawn, the lock's liveness check and the token.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
