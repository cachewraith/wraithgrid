appId: dev.cachewraith.wraithgrid
productName: Wraithgrid
copyright: Copyright © 2026 cachewraith
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - docs/licenses/**
  - docs/PROVIDER-LOGOS.md
  - '!**/*.map'
# No native Node modules since the Node pty host went (ADR 0004 phase 4b): nothing to rebuild.
npmRebuild: false
linux:
  target:
    - AppImage # any distro
    - deb # Ubuntu, Debian, Kali
    - rpm # Fedora
    - pacman # Arch
  category: Development
  icon: build/icon.png
  executableName: wraithgrid
  syncDesktopName: true
  synopsis: Many claude CLI sessions side by side
  description: Run several claude CLI sessions in one window, each with its own account (CLAUDE_CONFIG_DIR) and project folder.
  artifactName: ${name}-${version}-${arch}.${ext}
  # The Rust background host (ADR 0004 phase 2), off unless Settings → Advanced turns it on;
  # `bun run dist:linux` builds it first.
  extraResources:
    - from: host-rs/target/release/wraithgrid-host
      to: wraithgrid-host
    # Static hosts copied to Linux machines over ssh (scripts/build-remote-hosts.sh).
    - from: host-rs/target/remote
      to: remote
# Dependencies mirror the shared libraries the Electron binary links against
# (objdump -p … | grep NEEDED). Old Debian names also resolve on Ubuntu 24.04's t64 packages.
deb:
  packageCategory: devel
  depends:
    - libgtk-3-0
    - libglib2.0-0
    - libnss3
    - libnspr4
    - libatk1.0-0
    - libatk-bridge2.0-0
    - libatspi2.0-0
    - libcups2
    - libdbus-1-3
    - libgbm1
    - libasound2t64 | libasound2
    - libxkbcommon0
    - libxcomposite1
    - libxdamage1
    - libxrandr2
    - libxfixes3
    - libudev1
    - libexpat1
    - xdg-utils
rpm:
  packageCategory: Development/Tools
  depends:
    - gtk3
    - nss
    - nspr
    - at-spi2-atk
    - at-spi2-core
    - cups-libs
    - dbus-libs
    - mesa-libgbm
    - alsa-lib
    - libxkbcommon
    - libXcomposite
    - libXdamage
    - libXrandr
    - libXfixes
    - systemd-libs
    - expat
    - xdg-utils
  fpm:
    # Lets two Electron apps install side by side on Fedora (shared /usr/lib/.build-id links).
    - --rpm-rpmbuild-define=_build_id_links none
pacman:
  packageCategory: devel
  depends:
    - gtk3
    - nss
    - at-spi2-core
    - libcups
    - dbus
    - mesa
    - alsa-lib
    - libxkbcommon
    - libxcomposite
    - libxdamage
    - libxrandr
    - libxfixes
    - systemd-libs
    - expat
    - xdg-utils
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  # The Rust background host (ADR 0004 phase 3b), off unless Settings → Advanced turns it on;
  # `bun run dist:win` builds it first.
  extraResources:
    - from: host-rs/target/release/wraithgrid-host.exe
      to: wraithgrid-host.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Wraithgrid
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
# macOS: one dmg (to install) and one zip (what electron-updater reads) per CPU.
# Ad-hoc signed ("-"): Apple Silicon refuses to start unsigned code at all, and there is no
# Developer ID yet, so the app is not notarized and Gatekeeper asks once (see README).
# Hardened runtime stays off until there is a Developer ID to sign with.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  icon: build/icon.png
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  extendInfo:
    LSMinimumSystemVersion: '12.0'
  # The Rust background host (ADR 0004 phase 3), off unless Settings → Advanced turns it on:
  # one universal binary for both apps (`bun run dist:mac` runs scripts/build-mac-host.sh).
  extraResources:
    - from: host-rs/target/release/wraithgrid-host
      to: wraithgrid-host
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
# In-app updates (electron-updater) read latest.yml / latest-linux.yml from this repo's
# GitHub releases. The build never uploads (dist scripts pass --publish never); release.yml does.
publish:
  provider: github
  owner: cachewraith
  repo: wraithgrid
  releaseType: release
