appId: dev.cachewraith.wraithgrid
productName: Wraithgrid
copyright: Copyright © 2026 cachewraith
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: true
linux:
  target:
    - AppImage # any distro
    - deb # Ubuntu, Debian, Kali
    - rpm # Fedora
    - pacman # Arch
  category: Development
  icon: build/icon.png
  executableName: wraithgrid
  syncDesktopName: true
  synopsis: Many claude CLI sessions side by side
  description: Run several claude CLI sessions in one window, each with its own account (CLAUDE_CONFIG_DIR) and project folder.
  artifactName: ${name}-${version}-${arch}.${ext}
# Dependencies mirror the shared libraries the Electron binary links against
# (objdump -p … | grep NEEDED). Old Debian names also resolve on Ubuntu 24.04's t64 packages.
deb:
  packageCategory: devel
  depends:
    - libgtk-3-0
    - libglib2.0-0
    - libnss3
    - libnspr4
    - libatk1.0-0
    - libatk-bridge2.0-0
    - libatspi2.0-0
    - libcups2
    - libdbus-1-3
    - libgbm1
    - libasound2t64 | libasound2
    - libxkbcommon0
    - libxcomposite1
    - libxdamage1
    - libxrandr2
    - libxfixes3
    - libudev1
    - libexpat1
    - xdg-utils
rpm:
  packageCategory: Development/Tools
  depends:
    - gtk3
    - nss
    - nspr
    - at-spi2-atk
    - at-spi2-core
    - cups-libs
    - dbus-libs
    - mesa-libgbm
    - alsa-lib
    - libxkbcommon
    - libXcomposite
    - libXdamage
    - libXrandr
    - libXfixes
    - systemd-libs
    - expat
    - xdg-utils
  fpm:
    # Lets two Electron apps install side by side on Fedora (shared /usr/lib/.build-id links).
    - --rpm-rpmbuild-define=_build_id_links none
pacman:
  packageCategory: devel
  depends:
    - gtk3
    - nss
    - at-spi2-core
    - libcups
    - dbus
    - mesa
    - alsa-lib
    - libxkbcommon
    - libxcomposite
    - libxdamage
    - libxrandr
    - libxfixes
    - systemd-libs
    - expat
    - xdg-utils
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Wraithgrid
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
publish: null
